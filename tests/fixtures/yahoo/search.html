  .custom-control-input { position: absolute; z-index: -1; opacity: 0; }
  @media (min-width: 992px) { .mobileTabletOnly { display: none; } }
  .loadMoreBtn[hidden] { display: none; }
</style>
<script>
const JOBS = [
  {id: 101, title: "Senior Data Analyst", cat: "Engineering", country: "United States of America", cc: "United States", brand: "Yahoo Finance", exp: "Individual Contributor"},
  {id: 102, title: "Data Analyst, Ads", cat: "Engineering", country: "United States of America", cc: "United States", brand: "Yahoo", exp: "Individual Contributor"},
  {id: 103, title: "Principal Engineer, DevEx", cat: "Software Development", country: "United States of America", cc: "United States", brand: "Yahoo Engineering", exp: "Individual Contributor"},
  {id: 104, title: "Analyst, Campaign Operations", cat: "Engineering", country: "India", cc: "India", brand: "Yahoo", exp: "Early Career"},
  {id: 105, title: "Marketing Analyst", cat: "Marketing", country: "United States of America", cc: "United States", brand: "Yahoo", exp: "Individual Contributor"},
  {id: 106, title: "Director, CTO FP&A", cat: "Finance", country: "United States of America", cc: "United States", brand: "Yahoo", exp: "Management"},
  {id: 107, title: "Data Analyst (Dublin)", cat: "Engineering", country: "Ireland", cc: "Ireland", brand: "Yahoo Mail", exp: "Individual Contributor"},
  {id: 108, title: "Sr Research Scientist", cat: "Research", country: "United States of America", cc: "United States", brand: "Yahoo Search", exp: "Individual Contributor"},
  {id: 109, title: "Staff Data Analyst", cat: "Engineering", country: "United States of America", cc: "United States", brand: "Yahoo Finance", exp: "Sr Management"},
];
const PAGE = 3;
let matches = JOBS.slice();
let shown = 0;
function checked(id) { return Array.from(document.querySelectorAll('#' + id + ' input[type=checkbox]:checked')).map(i => i.value); }
function row(j) {
  return '<tr class="jobTitle"><td class="col-6" data-title="Title"><div class="innerJobTitle"><a href="/job/' + j.id + '.html" target="_blank">' + j.title + '</a><span class="brandType"></span></div></td>' +
         '<td class="col-3 tableBrand" data-title="Brand">' + j.brand + '</td><td class="col-3 tableLocation" data-title="Location"><div class="tableLocPrimary">' + j.country + '</div></td></tr>';
}
function render(reset) {
  const body = document.getElementById('tableJobListing');
  if (reset) { body.innerHTML = ''; shown = 0; }
  if (!matches.length) {  // exactly what yahooinc.com renders for an empty search
    body.innerHTML = '<div id="messageBox" class="errorMsg">We currently do not have any jobs matching your criteria. Please modify the search and try again.</div>';
    document.querySelector('.resultsTotal').textContent = "Please 'Clear' the search and try again";
    document.querySelector('.loadMoreBtn').hidden = true;
    return;
  }
  const next = matches.slice(shown, shown + PAGE);
  body.insertAdjacentHTML('beforeend', next.map(row).join(''));
  shown += next.length;
  document.querySelector('.resultsTotal').textContent = 'Showing ' + shown + ' results of ' + matches.length;
  document.querySelector('.loadMoreBtn').hidden = shown >= matches.length;
  document.getElementById('counter').textContent = String(shown);
}
function applyFilters(q, cats, locs, brands, exps) {
  matches = JOBS.filter(j => (!q || j.title.toLowerCase().includes(q)) && (!cats.length || cats.includes(j.cat)) &&
                              (!locs.length || locs.includes(j.cc)) && (!brands.length || brands.includes(j.brand)) && (!exps.length || exps.includes(j.exp)));
  document.querySelector('.loadingAction').style.display = 'block';
  setTimeout(() => { document.querySelector('.loadingAction').style.display = 'none'; render(true); }, 300);
}
function findJobs(ev) {
  ev.preventDefault();
  window.__submitted = (window.__submitted || 0) + 1;
  const form = ev.target;
  const q = form.querySelector('input[name=keyword]').value.trim().toLowerCase();
  applyFilters(q, checked('JCDropdown'), checked('JLDropdown'), checked('JBDropdown'), checked('JEDropdown'));
}
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('collapseFilterJobs').addEventListener('submit', findJobs);
  document.querySelectorAll('button.dropdown-toggle').forEach(b => b.addEventListener('click', () => b.parentElement.classList.toggle('show')));
  document.querySelector('a.stickyAccordion').addEventListener('click', () => document.getElementById('collapseFilterJobs').classList.toggle('show'));
  document.querySelector('button.loadMore').addEventListener('click', () => render(false));
  const params = new URLSearchParams(window.location.search);  // submitted from the landing page's form
  if ([...params.keys()].length) {
    const q = (params.get('keyword') || '').trim().toLowerCase();
    document.querySelector('#collapseFilterJobs input[name=keyword]').value = params.get('keyword') || '';
    applyFilters(q, params.getAll('categories[]'), params.getAll('locations[]'), params.getAll('brands[]'), []);
  } else {
    render(true);
  }
});
</script>
